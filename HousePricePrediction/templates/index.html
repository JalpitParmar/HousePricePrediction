<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right,#141e30,#243b55);
            min-height:100vh;
        }

        .card{
            border-radius:20px;
        }

        h1{
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg">

                <div class="card-body p-5">

                    <h1 class="text-center mb-4">
                        🏠 House Price Prediction
                    </h1>

                    <form action="/predict" method="POST">

                        <div class="row">

                            <!-- Area -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Area
                                </label>

                                <input type="number"
                                       class="form-control"
                                       name="area"
                                       required>

                            </div>

                            <!-- Bedrooms -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Bedrooms
                                </label>

                                <input type="number"
                                       class="form-control"
                                       name="bedrooms"
                                       required>

                            </div>

                            <!-- Bathrooms -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Bathrooms
                                </label>

                                <input type="number"
                                       class="form-control"
                                       name="bathrooms"
                                       required>

                            </div>

                            <!-- Stories -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Stories
                                </label>

                                <input type="number"
                                       class="form-control"
                                       name="stories"
                                       required>

                            </div>

                            <!-- Parking -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Parking
                                </label>

                                <input type="number"
                                       class="form-control"
                                       name="parking"
                                       required>

                            </div>

                            <!-- Mainroad -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Main Road
                                </label>

                                <select class="form-select"
                                        name="mainroad">

                                    <option value="yes">
                                        Yes
                                    </option>

                                    <option value="no">
                                        No
                                    </option>

                                </select>

                            </div>

                            <!-- Guestroom -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Guest Room
                                </label>

                                <select class="form-select"
                                        name="guestroom">

                                    <option value="yes">
                                        Yes
                                    </option>

                                    <option value="no">
                                        No
                                    </option>

                                </select>

                            </div>

                            <!-- Basement -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Basement
                                </label>

                                <select class="form-select"
                                        name="basement">

                                    <option value="yes">
                                        Yes
                                    </option>

                                    <option value="no">
                                        No
                                    </option>

                                </select>

                            </div>

                            <!-- Hot Water -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Hot Water Heating
                                </label>

                                <select class="form-select"
                                        name="hotwaterheating">

                                    <option value="yes">
                                        Yes
                                    </option>

                                    <option value="no">
                                        No
                                    </option>

                                </select>

                            </div>

                            <!-- AC -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Air Conditioning
                                </label>

                                <select class="form-select"
                                        name="airconditioning">

                                    <option value="yes">
                                        Yes
                                    </option>

                                    <option value="no">
                                        No
                                    </option>

                                </select>

                            </div>

                            <!-- Preferred Area -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Preferred Area
                                </label>

                                <select class="form-select"
                                        name="prefarea">

                                    <option value="yes">
                                        Yes
                                    </option>

                                    <option value="no">
                                        No
                                    </option>

                                </select>

                            </div>

                            <!-- Furnishing -->

                            <div class="col-md-12 mb-4">

                                <label class="form-label">
                                    Furnishing Status
                                </label>

                                <select class="form-select"
                                        name="furnishingstatus">

                                    <option value="furnished">
                                        Furnished
                                    </option>

                                    <option value="semi-furnished">
                                        Semi-Furnished
                                    </option>

                                    <option value="unfurnished">
                                        Unfurnished
                                    </option>

                                </select>

                            </div>

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 py-2">

                            Predict Price

                        </button>

                    </form>

                    <!-- Prediction -->

                    {% if prediction_text %}

                    <div class="alert alert-success mt-4 text-center">

                        <h3>
                            {{ prediction_text }}
                        </h3>

                    </div>

                    {% endif %}

                    <!-- Plotly Chart -->

                    {% if chart %}

                    <div class="mt-5">

                        {{ chart | safe }}

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
